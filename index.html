<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Webhook Sender</title>
<style>
  :root {
    --bg: #1a1b1e;
    --panel: #232428;
    --panel-2: #2b2d31;
    --border: #3a3c42;
    --text: #e6e6e8;
    --muted: #949ba4;
    --blurple: #5865f2;
    --blurple-hover: #4752c4;
    --green: #3ba55d;
    --red: #ed4245;
    --amber: #faa81a;
    --log-bg: #131417;
  }
  [data-theme="light"] {
    --bg: #f2f3f5;
    --panel: #ffffff;
    --panel-2: #f6f7f8;
    --border: #d9dbe0;
    --text: #1a1b1e;
    --muted: #6b7280;
    --blurple: #5865f2;
    --blurple-hover: #4752c4;
    --green: #1a8a3d;
    --red: #d83c3e;
    --amber: #b8760a;
    --log-bg: #f8f9fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "gg sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    transition: background .2s, color .2s;
  }
  .wrap { width: 100%; max-width: 640px; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    font-weight: 700;
  }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    flex: none;
    width: auto;
    transition: border-color .15s, background .15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .theme-toggle:hover { border-color: var(--blurple); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    transition: background .2s, border-color .2s;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .label-row label { margin-bottom: 6px; }
  .row-actions { display: flex; gap: 6px; }
  .mini-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    flex: none;
    width: auto;
    margin-bottom: 0;
  }
  .mini-btn:hover:not(:disabled) {
    border-color: var(--blurple);
    color: var(--text);
  }
  .mini-btn:disabled { opacity: .4; cursor: not-allowed; }
  .mini-btn.danger:hover:not(:disabled) {
    border-color: var(--red);
    color: var(--red);
  }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, background .2s, color .2s;
  }
  input:focus, textarea:focus { border-color: var(--blurple); }
  input:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
  textarea { resize: vertical; min-height: 90px; }

  /* Custom select */
  .select-wrap {
    position: relative;
  }
  .select-wrap select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 36px 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    cursor: pointer;
    transition: border-color .15s, background .2s, color .2s;
  }
  .select-wrap select:focus { border-color: var(--blurple); }
  .select-wrap select:disabled { opacity: .5; cursor: not-allowed; }
  .select-wrap::after {
    content: '';
    position: absolute;
    right: 14px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .select-wrap select option {
    background: var(--panel-2);
    color: var(--text);
  }

  .row { display: flex; gap: 12px; margin-top: 16px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .buttons { display: flex; gap: 12px; margin-top: 4px; }
  button.primary {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    color: #fff;
    background: var(--blurple);
    transition: background .15s, opacity .15s;
  }
  button.primary:hover:not(:disabled) { background: var(--blurple-hover); }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary.stop { background: var(--red); }
  button.primary.stop:hover:not(:disabled) { background: #c93b3e; }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .log-header label { margin-bottom: 0; }
  .log {
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    height: 220px;
    overflow-y: auto;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    transition: background .2s, border-color .2s;
  }
  .log div { margin: 0; }
  .ok   { color: var(--green); }
  .err  { color: var(--red); }
  .warn { color: var(--amber); }
  .dim  { color: var(--muted); }
  .bar {
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 14px;
    transition: background .2s;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--blurple);
    transition: width .2s;
  }
  .save-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div>
      <h1>Discord Webhook Sender</h1>
      <p class="sub">Fires a payload at a webhook endpoint N times, with rate-limit handling.</p>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">
      <span id="themeIcon">☀</span><span id="themeLabel">Light</span>
    </button>
  </div>

  <div class="panel">
    <div class="field">
      <div class="label-row">
        <label for="webhookSelect">Saved Webhooks</label>
        <div class="row-actions">
          <button type="button" class="mini-btn" id="newBtn">+ New</button>
          <button type="button" class="mini-btn danger" id="deleteBtn">Delete</button>
        </div>
      </div>
      <div class="select-wrap">
        <select id="webhookSelect"></select>
      </div>
      <div class="save-hint">All webhooks and settings are saved automatically to this browser.</div>
    </div>

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Main server, test channel…" maxlength="60">
    </div>

    <div class="field">
      <label for="webhookUrl">Webhook URL</label>
      <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/…">
    </div>
  </div>

  <div class="panel">
    <div class="field">
      <div class="label-row">
        <label for="message">Message</label>
        <button type="button" class="mini-btn" id="copyMessageBtn">Copy</button>
      </div>
      <textarea id="message" placeholder="Type the message to send…"></textarea>
    </div>

    <div class="row">
      <div>
        <label for="count">How many times</label>
        <input type="number" id="count" value="10" min="1" max="100000">
      </div>
      <div>
        <label for="delay">Delay between (ms)</label>
        <input type="number" id="delay" value="1000" min="0" max="60000">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="username">Override username (optional)</label>
        <input type="text" id="username" placeholder="leave blank to keep default">
      </div>
      <div>
        <label for="avatar">Avatar URL (optional)</label>
        <input type="text" id="avatar" placeholder="https://…">
      </div>
    </div>

    <div class="buttons" style="margin-top:20px;">
      <button class="primary" id="startBtn">Start</button>
      <button class="primary stop" id="stopBtn" disabled>Stop</button>
    </div>

    <div class="bar"><i id="progress"></i></div>
  </div>

  <div class="log-header">
    <label>Log</label>
    <button type="button" class="mini-btn" id="copyLogBtn">Copy Log</button>
  </div>
  <div class="log" id="log"><div class="dim">Ready.</div></div>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const startBtn = $('startBtn');
  const stopBtn  = $('stopBtn');
  const logEl    = $('log');
  const progEl   = $('progress');
  const copyMessageBtn = $('copyMessageBtn');
  const copyLogBtn = $('copyLogBtn');
  const themeToggle = $('themeToggle');
  const themeIcon = $('themeIcon');
  const themeLabel = $('themeLabel');
  const selectEl = $('webhookSelect');
  const newBtn = $('newBtn');
  const deleteBtn = $('deleteBtn');
  const nameInput = $('name');
  const urlInput = $('webhookUrl');

  const STORAGE_KEY = 'dws.config.v2';
  const LEGACY_KEY  = 'dws.config.v1';
  const THEME_KEY   = 'dws.theme';

  const SETTINGS_FIELDS = ['count', 'delay', 'username', 'avatar', 'message'];

  const state = {
    webhooks: [],   // [{ id, name, url }]
    activeId: null,
  };

  let running = false;
  let sent = 0;
  let target = 0;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function genId() {
    return 'wh_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function getActive() {
    return state.webhooks.find(w => w.id === state.activeId) || null;
  }

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'light') {
      themeIcon.textContent = '🌙';
      themeLabel.textContent = 'Dark';
    } else {
      themeIcon.textContent = '☀';
      themeLabel.textContent = 'Light';
    }
  }

  function initTheme() {
    let saved;
    try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
    if (saved === 'light' || saved === 'dark') {
      applyTheme(saved);
    } else {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(prefersLight ? 'light' : 'dark');
    }
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
  });

  // ---------- Persistence ----------
  function persist() {
    const settings = {};
    for (const k of SETTINGS_FIELDS) {
      const el = $(k);
      if (el) settings[k] = el.value;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        webhooks: state.webhooks,
        activeId: state.activeId,
        settings,
      }));
    } catch (_) {}
  }

  let saveTimer = null;
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveActiveFromForm();
      persist();
    }, 300);
  }

  function load() {
    let raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (_) {}

    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (Array.isArray(data.webhooks)) {
          state.webhooks = data.webhooks.filter(w => w && typeof w.id === 'string');
        }
        state.activeId = data.activeId || null;
        if (data.settings && typeof data.settings === 'object') {
          for (const k of SETTINGS_FIELDS) {
            if (data.settings[k] != null && $(k)) $(k).value = data.settings[k];
          }
        }
      } catch (_) {}
    } else {
      // Migrate legacy single-webhook storage
      let legacy;
      try { legacy = localStorage.getItem(LEGACY_KEY); } catch (_) {}
      if (legacy) {
        try {
          const d = JSON.parse(legacy);
          if (d.webhookUrl) {
            const id = genId();
            state.webhooks.push({ id, name: 'Default', url: d.webhookUrl });
            state.activeId = id;
          }
          for (const k of SETTINGS_FIELDS) {
            if (d[k] != null && $(k)) $(k).value = d[k];
          }
        } catch (_) {}
      }
    }

    if (!getActive()) {
      state.activeId = state.webhooks[0] ? state.webhooks[0].id : null;
    }
  }

  // ---------- UI Rendering ----------
  function renderSelect() {
    selectEl.innerHTML = '';

    if (state.webhooks.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '— no webhooks yet, click + New —';
      opt.disabled = true;
      opt.selected = true;
      selectEl.appendChild(opt);
      selectEl.disabled = true;
      return;
    }

    selectEl.disabled = false;
    for (const w of state.webhooks) {
      const opt = document.createElement('option');
      opt.value = w.id;
      opt.textContent = w.name || 'Untitled';
      if (w.id === state.activeId) opt.selected = true;
      selectEl.appendChild(opt);
    }
  }

  function loadActiveIntoForm() {
    const w = getActive();
    if (!w) {
      nameInput.value = '';
      urlInput.value = '';
      nameInput.disabled = true;
      urlInput.disabled = true;
      deleteBtn.disabled = true;
      return;
    }
    nameInput.disabled = false;
    urlInput.disabled = false;
    deleteBtn.disabled = false;
    nameInput.value = w.name || '';
    urlInput.value = w.url || '';
  }

  function saveActiveFromForm() {
    const w = getActive();
    if (!w) return;
    w.name = nameInput.value;
    w.url = urlInput.value;
  }

  // ---------- Webhook CRUD ----------
  newBtn.addEventListener('click', () => {
    saveActiveFromForm();
    const id = genId();
    state.webhooks.push({ id, name: 'New Webhook', url: '' });
    state.activeId = id;
    renderSelect();
    loadActiveIntoForm();
    persist();
    nameInput.focus();
    nameInput.select();
  });

  deleteBtn.addEventListener('click', () => {
    const w = getActive();
    if (!w) return;
    const label = w.name || 'Untitled';
    if (!confirm(`Delete "${label}"? This cannot be undone.`)) return;

    const idx = state.webhooks.findIndex(x => x.id === w.id);
    state.webhooks.splice(idx, 1);
    const next = state.webhooks[Math.min(idx, state.webhooks.length - 1)];
    state.activeId = next ? next.id : null;

    renderSelect();
    loadActiveIntoForm();
    persist();
  });

  selectEl.addEventListener('change', () => {
    saveActiveFromForm();
    state.activeId = selectEl.value || null;
    loadActiveIntoForm();
    persist();
  });

  nameInput.addEventListener('input', () => {
    const w = getActive();
    if (!w) return;
    w.name = nameInput.value;

    // Update the matching option's label live
    const opt = Array.from(selectEl.options).find(o => o.value === w.id);
    if (opt) opt.textContent = w.name || 'Untitled';

    scheduleSave();
  });

  urlInput.addEventListener('input', scheduleSave);

  for (const k of SETTINGS_FIELDS) {
    const el = $(k);
    if (el) el.addEventListener('input', scheduleSave);
  }

  window.addEventListener('beforeunload', () => {
    saveActiveFromForm();
    persist();
  });

  // ---------- Logging ----------
  function log(msg, cls = '') {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    const t = new Date().toLocaleTimeString();
    line.textContent = `[${t}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(done, total) {
    progEl.style.width = total > 0 ? `${Math.min(100, (done / total) * 100)}%` : '0%';
  }

  function validWebhook(url) {
    return /^https:\/\/(canary\.|ptb\.)?discord(app)?\.com\/api\/(v\d+\/)?webhooks\/\d+\/[\w-]+$/.test(url);
  }

  async function postOne(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.status === 429) {
      let retryMs = 1000;
      try {
        const data = await res.json();
        if (data && typeof data.retry_after === 'number') {
          retryMs = Math.ceil(data.retry_after * 1000) + 150;
        }
      } catch (_) {}
      return { retry: true, retryMs };
    }

    if (!res.ok) {
      let detail = '';
      try {
        const data = await res.json();
        detail = data.message || JSON.stringify(data);
      } catch (_) {
        detail = res.statusText;
      }
      return { ok: false, status: res.status, detail };
    }

    return { ok: true };
  }

  async function run() {
    saveActiveFromForm();
    const active = getActive();

    const url      = (active && active.url || '').trim();
    const label    = (active && active.name) ? `"${active.name}"` : '(unnamed)';
    const content  = $('message').value;
    const count    = parseInt($('count').value, 10);
    const delay    = Math.max(0, parseInt($('delay').value, 10) || 0);
    const username = $('username').value.trim();
    const avatar   = $('avatar').value.trim();

    if (!url)               return log('No webhook URL provided for the active entry.', 'err');
    if (!validWebhook(url)) return log('That does not look like a valid Discord webhook URL.', 'err');
    if (!content.trim() && !avatar) return log('Message is empty.', 'err');
    if (!Number.isFinite(count) || count < 1) return log('Invalid message count.', 'err');

    const body = { content };
    if (username) body.username = username;
    if (avatar)   body.avatar_url = avatar;

    running = true;
    sent = 0;
    target = count;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    logEl.innerHTML = '';
    setProgress(0, target);

    log(`Starting on ${label} — ${count} message(s), ${delay}ms apart.`, 'dim');

    let attempts = 0;
    const maxAttempts = count * 5;

    while (sent < target && running && attempts < maxAttempts) {
      attempts++;

      let result;
      try {
        result = await postOne(url, body);
      } catch (e) {
        log(`Network error: ${e.message}`, 'err');
        await sleep(Math.max(delay, 500));
        continue;
      }

      if (result.retry) {
        log(`Rate limited by Discord. Waiting ${result.retryMs}ms…`, 'warn');
        await sleep(result.retryMs);
        continue;
      }

      if (!result.ok) {
        log(`Failed (${result.status}): ${result.detail}`, 'err');
        if (result.status === 401 || result.status === 404 || result.status === 403) {
          log('Webhook appears invalid or revoked. Stopping.', 'err');
          break;
        }
        await sleep(Math.max(delay, 500));
        continue;
      }

      sent++;
      setProgress(sent, target);
      log(`Sent ${sent}/${target}`, 'ok');

      if (sent < target && running) await sleep(delay);
    }

    if (sent >= target) log(`Done. ${sent} message(s) delivered.`, 'ok');
    else if (!running)  log(`Stopped early. ${sent} message(s) delivered.`, 'warn');

    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setProgress(sent, target);
  }

  startBtn.addEventListener('click', () => {
    if (!running) run();
  });

  stopBtn.addEventListener('click', () => {
    if (running) {
      running = false;
      log('Stop requested…', 'warn');
    }
  });

  copyMessageBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('message').value);
      copyMessageBtn.textContent = 'Copied!';
      setTimeout(() => copyMessageBtn.textContent = 'Copy', 1200);
    } catch (e) {
      log('Clipboard write failed.', 'err');
    }
  });

  copyLogBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(logEl.innerText);
      copyLogBtn.textContent = 'Copied!';
      setTimeout(() => copyLogBtn.textContent = 'Copy Log', 1200);
    } catch (e) {
      log('Clipboard write failed.', 'err');
    }
  });

  // ---------- Init ----------
  initTheme();
  load();
  renderSelect();
  loadActiveIntoForm();
})();
</script>
</body>
</html>
