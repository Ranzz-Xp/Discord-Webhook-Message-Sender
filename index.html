<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Webhook Sender</tit<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook Sender</title>
<style>
  :root {
    --bg: #0b0c0f;
    --surface: #131418;
    --surface-2: #191a1f;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.13);
    --text: #e9eaee;
    --text-dim: #8a8c96;
    --muted: #6a6c75;
    --accent: #7b78f2;
    --accent-hover: #8f8cf5;
    --accent-soft: rgba(123,120,242,0.14);
    --danger: #e5636b;
    --ok: #56c596;
    --warn: #e0a54a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  [data-theme="light"] {
    --bg: #f7f7f9;
    --surface: #ffffff;
    --surface-2: #f4f4f6;
    --border: rgba(0,0,0,0.07);
    --border-strong: rgba(0,0,0,0.13);
    --text: #16171b;
    --text-dim: #6b6d78;
    --muted: #9698a2;
    --accent: #5b58e6;
    --accent-hover: #4a47d4;
    --accent-soft: rgba(91,88,230,0.10);
    --danger: #d8444c;
    --ok: #1f9d68;
    --warn: #b07a1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 56px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    transition: background .2s, color .2s;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(900px 480px at 50% -10%, var(--accent-soft), transparent 65%);
    pointer-events: none;
    z-index: -1;
  }
  .wrap { width: 100%; max-width: 680px; }

  /* Header */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 36px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 8px;
  }
  .sub {
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s, background .15s;
    flex: none;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .icon-btn svg { width: 16px; height: 16px; }
  [data-theme="dark"]  .icon-sun  { display: block; }
  [data-theme="dark"]  .icon-moon { display: none; }
  [data-theme="light"] .icon-sun  { display: none; }
  [data-theme="light"] .icon-moon { display: block; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 26px;
    margin-bottom: 18px;
  }
  [data-theme="light"] .card {
    box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 12px 32px -18px rgba(0,0,0,0.10);
  }
  [data-theme="dark"] .card {
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
  }

  .section { padding: 24px 0; }
  .section + .section { border-top: 1px solid var(--border); }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 22px;
    margin-bottom: 14px;
  }
  .kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .head-actions { display: flex; gap: 2px; }

  /* Ghost buttons */
  .ghost {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .ghost:disabled { opacity: 0.35; cursor: not-allowed; }
  .ghost.danger:hover:not(:disabled) { color: var(--danger); }

  /* Fields */
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  input[type="text"],
  input[type="number"],
  textarea,
  select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input:disabled, textarea:disabled, select:disabled { opacity: 0.45; cursor: not-allowed; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  textarea { resize: vertical; min-height: 96px; font-family: inherit; }

  /* Custom select */
  .select-wrap { position: relative; margin-bottom: 14px; }
  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 38px;
    cursor: pointer;
    font-weight: 500;
  }
  .select-wrap::after {
    content: '';
    position: absolute;
    right: 16px;
    top: 50%;
    width: 7px; height: 7px;
    border-right: 1.5px solid var(--text-dim);
    border-bottom: 1.5px solid var(--text-dim);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
  }
  .grid-2.name-url { grid-template-columns: 180px 1fr; }
  .grid-2:first-child { margin-top: 0; }

  /* Action buttons */
  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover:not(:disabled) { background: var(--surface); border-color: var(--border-strong); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  .btn.primary.stop { background: var(--danger); border-color: var(--danger); }
  .btn.primary.stop:hover:not(:disabled) { background: #c9565e; border-color: #c9565e; }

  .bar {
    height: 3px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 16px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .25s ease;
  }

  /* Log */
  .log-card { padding: 22px 22px; }
  .log-card .section-head { margin-bottom: 12px; }
  .log {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    height: 200px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-dim);
  }
  .log div { margin: 0; }
  .ok   { color: var(--ok); }
  .err  { color: var(--danger); }
  .warn { color: var(--warn); }
  .dim  { color: var(--muted); }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 99px;
  }
  .log::-webkit-scrollbar-track { background: transparent; }

  /* Responsive */
  @media (max-width: 560px) {
    body { padding: 32px 16px 60px; }
    h1 { font-size: 27px; }
    .top { margin-bottom: 26px; }
    .card { padding: 2px 18px; border-radius: 12px; }
    .log-card { padding: 18px 16px; }
    .grid-2, .grid-2.name-url { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Webhook Sender</h1>
      <p class="sub">Fire a message at a Discord webhook N times. Saved locally.</p>
    </div>
    <button type="button" class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <section class="card">
    <div class="section">
      <div class="section-head">
        <span class="kicker">Webhook</span>
        <div class="head-actions">
          <button type="button" class="ghost" id="newBtn">+ New</button>
          <button type="button" class="ghost danger" id="deleteBtn">Delete</button>
        </div>
      </div>
      <div class="select-wrap">
        <select id="webhookSelect"></select>
      </div>
      <div class="grid-2 name-url">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Main server" maxlength="60">
        </div>
        <div>
          <label for="webhookUrl">URL</label>
          <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/…">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="kicker">Message</span>
        <button type="button" class="ghost" id="copyMessageBtn">Copy</button>
      </div>
      <textarea id="message" placeholder="What should it say?"></textarea>
      <div class="grid-2">
        <div>
          <label for="count">Repeat</label>
          <input type="number" id="count" value="10" min="1" max="100000">
        </div>
        <div>
          <label for="delay">Delay (ms)</label>
          <input type="number" id="delay" value="1000" min="0" max="60000">
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label for="username">Username override</label>
          <input type="text" id="username" placeholder="Optional">
        </div>
        <div>
          <label for="avatar">Avatar URL</label>
          <input type="text" id="avatar" placeholder="Optional">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="btn-row">
        <button class="btn primary" id="startBtn">Send</button>
        <button class="btn" id="stopBtn" disabled>Stop</button>
      </div>
      <div class="bar"><i id="progress"></i></div>
    </div>
  </section>

  <section class="card log-card">
    <div class="section-head">
      <span class="kicker">Activity</span>
      <button type="button" class="ghost" id="copyLogBtn">Copy</button>
    </div>
    <div class="log" id="log"><div class="dim">Idle.</div></div>
  </section>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const startBtn       = $('startBtn');
  const stopBtn        = $('stopBtn');
  const logEl          = $('log');
  const progEl         = $('progress');
  const copyMessageBtn = $('copyMessageBtn');
  const copyLogBtn     = $('copyLogBtn');
  const themeToggle    = $('themeToggle');
  const selectEl       = $('webhookSelect');
  const newBtn         = $('newBtn');
  const deleteBtn      = $('deleteBtn');
  const nameInput      = $('name');
  const urlInput       = $('webhookUrl');

  const STORAGE_KEY = 'dws.config.v2';
  const LEGACY_KEY  = 'dws.config.v1';
  const THEME_KEY   = 'dws.theme';

  const SETTINGS_FIELDS = ['count', 'delay', 'username', 'avatar', 'message'];

  const state = {
    webhooks: [],
    activeId: null,
  };

  let running = false;
  let sent = 0;
  let target = 0;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const genId = () =>
    'wh_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  const getActive = () =>
    state.webhooks.find(w => w.id === state.activeId) || null;

  // ---------- Theme ----------
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
  }

  function initTheme() {
    let saved;
    try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
    if (saved === 'light' || saved === 'dark') {
      setTheme(saved);
    } else {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      setTheme(prefersLight ? 'light' : 'dark');
    }
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    setTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
  });

  // ---------- Persistence ----------
  function persist() {
    const settings = {};
    for (const k of SETTINGS_FIELDS) {
      const el = $(k);
      if (el) settings[k] = el.value;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        webhooks: state.webhooks,
        activeId: state.activeId,
        settings,
      }));
    } catch (_) {}
  }

  let saveTimer = null;
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveActiveFromForm();
      persist();
    }, 300);
  }

  function load() {
    let raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (_) {}

    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (Array.isArray(data.webhooks)) {
          state.webhooks = data.webhooks.filter(w => w && typeof w.id === 'string');
        }
        state.activeId = data.activeId || null;
        if (data.settings && typeof data.settings === 'object') {
          for (const k of SETTINGS_FIELDS) {
            if (data.settings[k] != null && $(k)) $(k).value = data.settings[k];
          }
        }
      } catch (_) {}
    } else {
      let legacy;
      try { legacy = localStorage.getItem(LEGACY_KEY); } catch (_) {}
      if (legacy) {
        try {
          const d = JSON.parse(legacy);
          if (d.webhookUrl) {
            const id = genId();
            state.webhooks.push({ id, name: 'Default', url: d.webhookUrl });
            state.activeId = id;
          }
          for (const k of SETTINGS_FIELDS) {
            if (d[k] != null && $(k)) $(k).value = d[k];
          }
        } catch (_) {}
      }
    }

    if (!getActive()) {
      state.activeId = state.webhooks[0] ? state.webhooks[0].id : null;
    }
  }

  // ---------- Rendering ----------
  function renderSelect() {
    selectEl.innerHTML = '';

    if (state.webhooks.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '— no webhooks yet —';
      opt.disabled = true;
      opt.selected = true;
      selectEl.appendChild(opt);
      selectEl.disabled = true;
      return;
    }

    selectEl.disabled = false;
    for (const w of state.webhooks) {
      const opt = document.createElement('option');
      opt.value = w.id;
      opt.textContent = w.name || 'Untitled';
      if (w.id === state.activeId) opt.selected = true;
      selectEl.appendChild(opt);
    }
  }

  function loadActiveIntoForm() {
    const w = getActive();
    if (!w) {
      nameInput.value = '';
      urlInput.value = '';
      nameInput.disabled = true;
      urlInput.disabled = true;
      deleteBtn.disabled = true;
      return;
    }
    nameInput.disabled = false;
    urlInput.disabled = false;
    deleteBtn.disabled = false;
    nameInput.value = w.name || '';
    urlInput.value = w.url || '';
  }

  function saveActiveFromForm() {
    const w = getActive();
    if (!w) return;
    w.name = nameInput.value;
    w.url = urlInput.value;
  }

  // ---------- CRUD ----------
  newBtn.addEventListener('click', () => {
    saveActiveFromForm();
    const id = genId();
    state.webhooks.push({ id, name: 'New Webhook', url: '' });
    state.activeId = id;
    renderSelect();
    loadActiveIntoForm();
    persist();
    nameInput.focus();
    nameInput.select();
  });

  deleteBtn.addEventListener('click', () => {
    const w = getActive();
    if (!w) return;
    const label = w.name || 'Untitled';
    if (!confirm(`Delete "${label}"?`)) return;

    const idx = state.webhooks.findIndex(x => x.id === w.id);
    state.webhooks.splice(idx, 1);
    const next = state.webhooks[Math.min(idx, state.webhooks.length - 1)];
    state.activeId = next ? next.id : null;

    renderSelect();
    loadActiveIntoForm();
    persist();
  });

  selectEl.addEventListener('change', () => {
    saveActiveFromForm();
    state.activeId = selectEl.value || null;
    loadActiveIntoForm();
    persist();
  });

  nameInput.addEventListener('input', () => {
    const w = getActive();
    if (!w) return;
    w.name = nameInput.value;
    const opt = Array.from(selectEl.options).find(o => o.value === w.id);
    if (opt) opt.textContent = w.name || 'Untitled';
    scheduleSave();
  });

  urlInput.addEventListener('input', scheduleSave);

  for (const k of SETTINGS_FIELDS) {
    const el = $(k);
    if (el) el.addEventListener('input', scheduleSave);
  }

  window.addEventListener('beforeunload', () => {
    saveActiveFromForm();
    persist();
  });

  // ---------- Logging ----------
  function log(msg, cls = '') {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    const t = new Date().toLocaleTimeString();
    line.textContent = `[${t}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(done, total) {
    progEl.style.width = total > 0 ? `${Math.min(100, (done / total) * 100)}%` : '0%';
  }

  function validWebhook(url) {
    return /^https:\/\/(canary\.|ptb\.)?discord(app)?\.com\/api\/(v\d+\/)?webhooks\/\d+\/[\w-]+$/.test(url);
  }

  async function postOne(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.status === 429) {
      let retryMs = 1000;
      try {
        const data = await res.json();
        if (data && typeof data.retry_after === 'number') {
          retryMs = Math.ceil(data.retry_after * 1000) + 150;
        }
      } catch (_) {}
      return { retry: true, retryMs };
    }

    if (!res.ok) {
      let detail = '';
      try {
        const data = await res.json();
        detail = data.message || JSON.stringify(data);
      } catch (_) {
        detail = res.statusText;
      }
      return { ok: false, status: res.status, detail };
    }

    return { ok: true };
  }

  async function run() {
    saveActiveFromForm();
    const active = getActive();

    const url      = (active && active.url || '').trim();
    const label    = (active && active.name) ? `"${active.name}"` : '(unnamed)';
    const content  = $('message').value;
    const count    = parseInt($('count').value, 10);
    const delay    = Math.max(0, parseInt($('delay').value, 10) || 0);
    const username = $('username').value.trim();
    const avatar   = $('avatar').value.trim();

    if (!url)               return log('No webhook URL for the active entry.', 'err');
    if (!validWebhook(url)) return log('That does not look like a valid Discord webhook URL.', 'err');
    if (!content.trim() && !avatar) return log('Message is empty.', 'err');
    if (!Number.isFinite(count) || count < 1) return log('Invalid message count.', 'err');

    const body = { content };
    if (username) body.username = username;
    if (avatar)   body.avatar_url = avatar;

    running = true;
    sent = 0;
    target = count;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    logEl.innerHTML = '';
    setProgress(0, target);

    log(`Starting on ${label} — ${count} message(s), ${delay}ms apart.`, 'dim');

    let attempts = 0;
    const maxAttempts = count * 5;

    while (sent < target && running && attempts < maxAttempts) {
      attempts++;

      let result;
      try {
        result = await postOne(url, body);
      } catch (e) {
        log(`Network error: ${e.message}`, 'err');
        await sleep(Math.max(delay, 500));
        continue;
      }

      if (result.retry) {
        log(`Rate limited. Waiting ${result.retryMs}ms…`, 'warn');
        await sleep(result.retryMs);
        continue;
      }

      if (!result.ok) {
        log(`Failed (${result.status}): ${result.detail}`, 'err');
        if ([401, 403, 404].includes(result.status)) {
          log('Webhook appears invalid or revoked. Stopping.', 'err');
          break;
        }
        await sleep(Math.max(delay, 500));
        continue;
      }

      sent++;
      setProgress(sent, target);
      log(`Sent ${sent}/${target}`, 'ok');

      if (sent < target && running) await sleep(delay);
    }

    if (sent >= target) log(`Done. ${sent} message(s) delivered.`, 'ok');
    else if (!running)  log(`Stopped early. ${sent} message(s) delivered.`, 'warn');

    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;

<body>
<div class="wrap">

  <div class="top-bar">
    <div>
      <h1>Discord Webhook Sender</h1>
      <p class="sub">Fires a payload at a webhook endpoint N times, with rate-limit handling.</p>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">
      <span id="themeIcon">☀</span><span id="themeLabel">Light</span>
    </button>
  </div>

  <div class="panel">
    <div class="field">
      <div class="label-row">
        <label for="webhookSelect">Saved Webhooks</label>
        <div class="row-actions">
          <button type="button" class="mini-btn" id="newBtn">+ New</button>
          <button type="button" class="mini-btn danger" id="deleteBtn">Delete</button>
        </div>
      </div>
      <div class="select-wrap">
        <select id="webhookSelect"></select>
      </div>
      <div class="save-hint">All webhooks and settings are saved automatically to this browser.</div>
    </div>

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Main server, test channel…" maxlength="60">
    </div>

    <div class="field">
      <label for="webhookUrl">Webhook URL</label>
      <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/…">
    </div>
  </div>

  <div class="panel">
    <div class="field">
      <div class="label-row">
        <label for="message">Message</label>
        <button type="button" class="mini-btn" id="copyMessageBtn">Copy</button>
      </div>
      <textarea id="message" placeholder="Type the message to send…"></textarea>
    </div>

    <div class="row">
      <div>
        <label for="count">How many times</label>
        <input type="number" id="count" value="10" min="1" max="100000">
      </div>
      <div>
        <label for="delay">Delay between (ms)</label>
        <input type="number" id="delay" value="1000" min="0" max="60000">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="username">Override username (optional)</label>
        <input type="text" id="username" placeholder="leave blank to keep default">
      </div>
      <div>
        <label for="avatar">Avatar URL (optional)</label>
        <input type="text" id="avatar" placeholder="https://…">
      </div>
    </div>

    <div class="buttons" style="margin-top:20px;">
      <button class="primary" id="startBtn">Start</button>
      <button class="primary stop" id="stopBtn" disabled>Stop</button>
    </div>

    <div class="bar"><i id="progress"></i></div>
  </div>

  <div class="log-header">
    <label>Log</label>
    <button type="button" class="mini-btn" id="copyLogBtn">Copy Log</button>
  </div>
  <div class="log" id="log"><div class="dim">Ready.</div></div>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const startBtn = $('startBtn');
  const stopBtn  = $('stopBtn');
  const logEl    = $('log');
  const progEl   = $('progress');
  const copyMessageBtn = $('copyMessageBtn');
  const copyLogBtn = $('copyLogBtn');
  const themeToggle = $('themeToggle');
  const themeIcon = $('themeIcon');
  const themeLabel = $('themeLabel');
  const selectEl = $('webhookSelect');
  const newBtn = $('newBtn');
  const deleteBtn = $('deleteBtn');
  const nameInput = $('name');
  const urlInput = $('webhookUrl');

  const STORAGE_KEY = 'dws.config.v2';
  const LEGACY_KEY  = 'dws.config.v1';
  const THEME_KEY   = 'dws.theme';

  const SETTINGS_FIELDS = ['count', 'delay', 'username', 'avatar', 'message'];

  const state = {
    webhooks: [],   // [{ id, name, url }]
    activeId: null,
  };

  let running = false;
  let sent = 0;
  let target = 0;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function genId() {
    return 'wh_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function getActive() {
    return state.webhooks.find(w => w.id === state.activeId) || null;
  }

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'light') {
      themeIcon.textContent = '🌙';
      themeLabel.textContent = 'Dark';
    } else {
      themeIcon.textContent = '☀';
      themeLabel.textContent = 'Light';
    }
  }

  function initTheme() {
    let saved;
    try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
    if (saved === 'light' || saved === 'dark') {
      applyTheme(saved);
    } else {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(prefersLight ? 'light' : 'dark');
    }
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
  });

  // ---------- Persistence ----------
  function persist() {
    const settings = {};
    for (const k of SETTINGS_FIELDS) {
      const el = $(k);
      if (el) settings[k] = el.value;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        webhooks: state.webhooks,
        activeId: state.activeId,
        settings,
      }));
    } catch (_) {}
  }

  let saveTimer = null;
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveActiveFromForm();
      persist();
    }, 300);
  }

  function load() {
    let raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (_) {}

    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (Array.isArray(data.webhooks)) {
          state.webhooks = data.webhooks.filter(w => w && typeof w.id === 'string');
        }
        state.activeId = data.activeId || null;
        if (data.settings && typeof data.settings === 'object') {
          for (const k of SETTINGS_FIELDS) {
            if (data.settings[k] != null && $(k)) $(k).value = data.settings[k];
          }
        }
      } catch (_) {}
    } else {
      // Migrate legacy single-webhook storage
      let legacy;
      try { legacy = localStorage.getItem(LEGACY_KEY); } catch (_) {}
      if (legacy) {
        try {
          const d = JSON.parse(legacy);
          if (d.webhookUrl) {
            const id = genId();
            state.webhooks.push({ id, name: 'Default', url: d.webhookUrl });
            state.activeId = id;
          }
          for (const k of SETTINGS_FIELDS) {
            if (d[k] != null && $(k)) $(k).value = d[k];
          }
        } catch (_) {}
      }
    }

    if (!getActive()) {
      state.activeId = state.webhooks[0] ? state.webhooks[0].id : null;
    }
  }

  // ---------- UI Rendering ----------
  function renderSelect() {
    selectEl.innerHTML = '';

    if (state.webhooks.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '— no webhooks yet, click + New —';
      opt.disabled = true;
      opt.selected = true;
      selectEl.appendChild(opt);
      selectEl.disabled = true;
      return;
    }

    selectEl.disabled = false;
    for (const w of state.webhooks) {
      const opt = document.createElement('option');
      opt.value = w.id;
      opt.textContent = w.name || 'Untitled';
      if (w.id === state.activeId) opt.selected = true;
      selectEl.appendChild(opt);
    }
  }

  function loadActiveIntoForm() {
    const w = getActive();
    if (!w) {
      nameInput.value = '';
      urlInput.value = '';
      nameInput.disabled = true;
      urlInput.disabled = true;
      deleteBtn.disabled = true;
      return;
    }
    nameInput.disabled = false;
    urlInput.disabled = false;
    deleteBtn.disabled = false;
    nameInput.value = w.name || '';
    urlInput.value = w.url || '';
  }

  function saveActiveFromForm() {
    const w = getActive();
    if (!w) return;
    w.name = nameInput.value;
    w.url = urlInput.value;
  }

  // ---------- Webhook CRUD ----------
  newBtn.addEventListener('click', () => {
    saveActiveFromForm();
    const id = genId();
    state.webhooks.push({ id, name: 'New Webhook', url: '' });
    state.activeId = id;
    renderSelect();
    loadActiveIntoForm();
    persist();
    nameInput.focus();
    nameInput.select();
  });

  deleteBtn.addEventListener('click', () => {
    const w = getActive();
    if (!w) return;
    const label = w.name || 'Untitled';
    if (!confirm(`Delete "${label}"? This cannot be undone.`)) return;

    const idx = state.webhooks.findIndex(x => x.id === w.id);
    state.webhooks.splice(idx, 1);
    const next = state.webhooks[Math.min(idx, state.webhooks.length - 1)];
    state.activeId = next ? next.id : null;

    renderSelect();
    loadActiveIntoForm();
    persist();
  });

  selectEl.addEventListener('change', () => {
    saveActiveFromForm();
    state.activeId = selectEl.value || null;
    loadActiveIntoForm();
    persist();
  });

  nameInput.addEventListener('input', () => {
    const w = getActive();
    if (!w) return;
    w.name = nameInput.value;

    // Update the matching option's label live
    const opt = Array.from(selectEl.options).find(o => o.value === w.id);
    if (opt) opt.textContent = w.name || 'Untitled';

    scheduleSave();
  });

  urlInput.addEventListener('input', scheduleSave);

  for (const k of SETTINGS_FIELDS) {
    const el = $(k);
    if (el) el.addEventListener('input', scheduleSave);
  }

  window.addEventListener('beforeunload', () => {
    saveActiveFromForm();
    persist();
  });

  // ---------- Logging ----------
  function log(msg, cls = '') {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    const t = new Date().toLocaleTimeString();
    line.textContent = `[${t}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(done, total) {
    progEl.style.width = total > 0 ? `${Math.min(100, (done / total) * 100)}%` : '0%';
  }

  function validWebhook(url) {
    return /^https:\/\/(canary\.|ptb\.)?discord(app)?\.com\/api\/(v\d+\/)?webhooks\/\d+\/[\w-]+$/.test(url);
  }

  async function postOne(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.status === 429) {
      let retryMs = 1000;
      try {
        const data = await res.json();
        if (data && typeof data.retry_after === 'number') {
          retryMs = Math.ceil(data.retry_after * 1000) + 150;
        }
      } catch (_) {}
      return { retry: true, retryMs };
    }

    if (!res.ok) {
      let detail = '';
      try {
        const data = await res.json();
        detail = data.message || JSON.stringify(data);
      } catch (_) {
        detail = res.statusText;
      }
      return { ok: false, status: res.status, detail };
    }

    return { ok: true };
  }

  async function run() {
    saveActiveFromForm();
    const active = getActive();

    const url      = (active && active.url || '').trim();
    const label    = (active && active.name) ? `"${active.name}"` : '(unnamed)';
    const content  = $('message').value;
    const count    = parseInt($('count').value, 10);
    const delay    = Math.max(0, parseInt($('delay').value, 10) || 0);
    const username = $('username').value.trim();
    const avatar   = $('avatar').value.trim();

    if (!url)               return log('No webhook URL provided for the active entry.', 'err');
    if (!validWebhook(url)) return log('That does not look like a valid Discord webhook URL.', 'err');
    if (!content.trim() && !avatar) return log('Message is empty.', 'err');
    if (!Number.isFinite(count) || count < 1) return log('Invalid message count.', 'err');

    const body = { content };
    if (username) body.username = username;
    if (avatar)   body.avatar_url = avatar;

    running = true;
    sent = 0;
    target = count;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    logEl.innerHTML = '';
    setProgress(0, target);

    log(`Starting on ${label} — ${count} message(s), ${delay}ms apart.`, 'dim');

    let attempts = 0;
    const maxAttempts = count * 5;

    while (sent < target && running && attempts < maxAttempts) {
      attempts++;

      let result;
      try {
        result = await postOne(url, body);
      } catch (e) {
        log(`Network error: ${e.message}`, 'err');
        await sleep(Math.max(delay, 500));
        continue;
      }

      if (result.retry) {
        log(`Rate limited by Discord. Waiting ${result.retryMs}ms…`, 'warn');
        await sleep(result.retryMs);
        continue;
      }

      if (!result.ok) {
        log(`Failed (${result.status}): ${result.detail}`, 'err');
        if (result.status === 401 || result.status === 404 || result.status === 403) {
          log('Webhook appears invalid or revoked. Stopping.', 'err');
          break;
        }
        await sleep(Math.max(delay, 500));
        continue;
      }

      sent++;
      setProgress(sent, target);
      log(`Sent ${sent}/${target}`, 'ok');

      if (sent < target && running) await sleep(delay);
    }

    if (sent >= target) log(`Done. ${sent} message(s) delivered.`, 'ok');
    else if (!running)  log(`Stopped early. ${sent} message(s) delivered.`, 'warn');

    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setProgress(sent, target);
  }

  startBtn.addEventListener('click', () => {
    if (!running) run();
  });

  stopBtn.addEventListener('click', () => {
    if (running) {
      running = false;
      log('Stop requested…', 'warn');
    }
  });

  copyMessageBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('message').value);
      copyMessageBtn.textContent = 'Copied!';
      setTimeout(() => copyMessageBtn.textContent = 'Copy', 1200);
    } catch (e) {
      log('Clipboard write failed.', 'err');
    }
  });

  copyLogBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(logEl.innerText);
      copyLogBtn.textContent = 'Copied!';
      setTimeout(() => copyLogBtn.textContent = 'Copy Log', 1200);
    } catch (e) {
      log('Clipboard write failed.', 'err');
    }
  });

  // ---------- Init ----------
  initTheme();
  load();
  renderSelect();
  loadActiveIntoForm();
})();
</script>
